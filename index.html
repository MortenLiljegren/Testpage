<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MythBusters Interactive Quiz</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent-yellow: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Start Screen */
    .setup-group {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select, button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select:focus {
      outline: 2px solid var(--accent-blue);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      border: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    /* Game Screen */
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      transition: width 0.3s ease;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .timer-badge {
      color: var(--accent-yellow);
      font-weight: 700;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 24px;
      min-height: 70px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .btn-option {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border-color);
      text-align: center;
      padding: 16px;
      font-size: 1.1rem;
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.1);
    }

    .btn-option.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--accent-green) !important;
      color: #34d399 !important;
    }

    .btn-option.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--accent-red) !important;
      color: #f87171 !important;
    }

    .explanation-box {
      background: rgba(15, 23, 42, 0.8);
      border-left: 4px solid var(--accent-yellow);
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-top: 16px;
      display: none;
    }

    .btn-next {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      margin-top: 16px;
      display: none;
    }

    .btn-next:hover {
      background: #2563eb;
    }

    /* Score Screen */
    .results-container {
      text-align: center;
      padding: 20px 0;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, rgba(0,0,0,0) 70%);
      border: 4px solid var(--accent-yellow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    .score-num {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .score-total {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    
    <!-- Header -->
    <div class="quiz-header">
      <span class="badge">I&amp;A Mobility Fika Activity</span>
      <h1>MythBusters Quiz</h1>
      <p class="subtitle">Counter-Intuitive Science Trivia</p>
    </div>

    <!-- 1. Start Screen -->
    <div id="screen-start">
      <div class="setup-group">
        <label for="select-count">Number of Questions:</label>
        <select id="select-count">
          <option value="10">10 Questions (~5 mins)</option>
          <option value="15" selected>15 Questions (~8 mins)</option>
          <option value="20">20 Questions (~10 mins)</option>
          <option value="30">All 30 Questions (~15 mins)</option>
        </select>
      </div>

      <div class="setup-group">
        <label for="select-timer">Time Per Question:</label>
        <select id="select-timer">
          <option value="0">No Timer (Relaxed)</option>
          <option value="15" selected>15 Seconds</option>
          <option value="20">20 Seconds</option>
        </select>
      </div>

      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- 2. Game Screen -->
    <div id="screen-game" class="hidden">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="meta-info">
        <span id="question-tracker">Question 1/15</span>
        <span id="timer-display" class="timer-badge">⏱️ 15s</span>
      </div>

      <div class="question-text" id="question-text">
        Loading question...
      </div>

      <div class="options-grid">
        <button class="btn-option" id="btn-true" onclick="selectAnswer(true)">True</button>
        <button class="btn-option" id="btn-false" onclick="selectAnswer(false)">False</button>
      </div>

      <div class="explanation-box" id="explanation-box">
        <strong>MythBusters Result:</strong> <span id="explanation-text"></span>
      </div>

      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- 3. Results Screen -->
    <div id="screen-results" class="hidden">
      <div class="results-container">
        <h2>Quiz Completed!</h2>
        <p class="subtitle" id="results-message">Great job team!</p>

        <div class="score-circle">
          <span class="score-num" id="final-score">0</span>
          <span class="score-total" id="final-total">out of 15</span>
        </div>

        <button class="btn-primary" onclick="resetToStart()">Play Again</button>
      </div>
    </div>

  </div>

  <script>
    const allQuestions = [
      { q: "Can a penny dropped from the top of a skyscraper kill a pedestrian below?", a: false, exp: "Due to air resistance, its terminal velocity is too low to penetrate or fracture a human skull." },
      { q: "Does a snowman melt slower if you put a winter coat on it?", a: true, exp: "The coat acts as insulation, keeping cold air inside and warm ambient air out." },
      { q: "Do you get LESS wet by RUNNING through the rain compared to WALKING?", a: true, exp: "Even though you hit more drops in front of you, your total exposure time drops enough to keep you drier." },
      { q: "Is it possible to survive jumping out of an airplane without a parachute by catching another skydiver mid-air?", a: true, exp: "MythBusters proved that mid-air interception and holding on is physically possible due to terminal velocity alignment." },
      { q: "Are elephants actually afraid of tiny mice?", a: true, exp: "When MythBusters hid a mouse under dung, elephants stopped, backed away, and actively avoided it in panic." },
      { q: "Will a car explode if you shoot its gas tank with a standard handgun?", a: false, exp: "Normal bullets don't create enough heat/sparks to ignite gasoline vapour. You need incendiary or tracer rounds." },
      { q: "Is dropping a plugged-in hairdryer into a full bathtub always fatal?", a: false, exp: "Modern GFCI/RCD circuit breakers cut the power in milliseconds before a lethal current reaches you." },
      { q: "Does swearing and shouting profanities actually increase your tolerance to physical pain?", a: true, exp: "Test subjects kept their hands in ice water significantly longer when cursing compared to neutral words." },
      { q: "Does striking a match on a toilet actually remove bad odours?", a: false, exp: "The strong sulphur scent simply masks the smell in your nose—it doesn't eliminate or burn away the gas molecules." },
      { q: "Do you consume noticeably more fuel when driving while angry or stressed?", a: true, exp: "Aggressive, jerky driving with sudden braking and acceleration drastically increases fuel consumption." },
      { q: "Does a bird flying inside a closed truck cargo bay make the truck lighter on a scale?", a: false, exp: "The downward air pressure generated by the bird's wings exerts the exact same weight force on the truck floor." },
      { q: "Can shifting a car into Reverse while driving 80 km/h (50 mph) cause the transmission to explode?", a: false, exp: "Modern automatic cars have safety lockouts that force the car into Neutral or simply ignore the input." },
      { q: "Can a playing card thrown by hand inflict a lethal wound on a human?", a: false, exp: "Even fired from a high-speed mechanical launcher, paper playing cards can only cause minor surface cuts." },
      { q: "Can you survive a falling elevator by jumping up at the exact millisecond before impact?", a: false, exp: "Your body is moving downward at high speed; a small jump barely reduces your downward momentum at all." },
      { q: "Can you briefly dip a wet hand into molten liquid lead (400°C) without burning yourself?", a: true, exp: "Moisture instantly vaporizes, creating a fleeting protective steam barrier (Leidenfrost Effect)." },
      { q: "Is it possible to polish a piece of dried animal poop until it shines like glass?", a: true, exp: "Using the Japanese Dorodango dirt-polishing technique, they made frozen poop surprisingly shiny and glossy." },
      { q: "Can using a mobile phone at a petrol station spark a gas vapor explosion?", a: false, exp: "The real culprit behind petrol station sparks is static electricity generated by people's clothing/car seats." },
      { q: "Does drinking a cup of strong black coffee help sober up a drunk person faster?", a: false, exp: "Coffee only creates a 'wide-awake drunk person'—it has zero effect on blood alcohol concentration." },
      { q: "Can a bullet shot from a high-powered rifle travel deep underwater to hit a target?", a: false, exp: "Water resistance against high-velocity rounds causes bullets to shatter on impact. You are safe 1 metre under." },
      { q: "Can a standard car drive straight through a closed wooden garage door without stopping the engine?", a: true, exp: "Standard wooden garage doors splinter so easily that the car drives right through with minimal engine damage." },
      { q: "Is driving a car while talking on a hands-free phone as dangerous as driving intoxicated?", a: true, exp: "Studies showed hands-free phone calls cause cognitive distraction equal to a 0.08% blood alcohol level." },
      { q: "If a toast with butter falls off a table, is it more likely to land butter-side down?", a: true, exp: "Standard table height gives the toast just enough distance to complete a half-rotation, usually landing butter-side down." },
      { q: "Can an opera singer break a wine glass using only their unamplified voice?", a: true, exp: "If the singer matches the glass's precise resonant frequency at high volume, the vibration shatters it." },
      { q: "Does driving with the tailgate DOWN on a pickup truck save fuel by reducing drag?", a: false, exp: "Leaving the tailgate UP creates a recirculating air pocket that lets passing air glide smoothly over the bed." },
      { q: "Can a bull in a china shop actually walk around without smashing the porcelain?", a: true, exp: "When tested with live bulls in a narrow shop setup, the bulls carefully dodged all fragile shelves." },
      { q: "Can a duck’s quack produce an echo?", a: true, exp: "It's an old urban legend that it doesn't—an acoustic chamber proved duck quacks echo like any other sound." },
      { q: "Does dirtying a car make it consume significantly more fuel due to drag?", a: false, exp: "Surprisingly, a golf-ball-style dimpled/muddy surface actually broke wind drag and improved fuel efficiency slightly." },
      { q: "Can you put out a grease fire in a frying pan by throwing water on it?", a: false, exp: "Water sinks below the burning oil, instantly vaporizes into steam, and expands rapidly, causing a giant fireball!" },
      { q: "Can a deep sneeze blow your eyeballs out of your head if you force your eyes to stay open?", a: false, exp: "The pressure in your nasal passages is completely isolated from your eye sockets; your eyes remain securely in place." },
      { q: "Is it safer to stand under a tall tree during a severe lightning storm?", a: false, exp: "Tall objects attract lightning, and ground current or 'side flashes' from the trunk make trees extremely dangerous shelter." }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timerDuration = 15;
    let timerInterval = null;
    let timeLeft = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      const count = parseInt(document.getElementById('select-count').value);
      timerDuration = parseInt(document.getElementById('select-timer').value);

      currentQuestions = shuffle([...allQuestions]).slice(0, count);
      currentIndex = 0;
      score = 0;

      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      resetState();
      const q = currentQuestions[currentIndex];

      document.getElementById('question-tracker').innerText = `Question ${currentIndex + 1}/${currentQuestions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
      document.getElementById('question-text').innerText = q.q;

      if (timerDuration > 0) {
        timeLeft = timerDuration;
        document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timeOut();
          }
        }, 1000);
      } else {
        document.getElementById('timer-display').innerText = '';
      }
    }

    function resetState() {
      clearInterval(timerInterval);
      document.getElementById('btn-true').classList.remove('correct', 'wrong');
      document.getElementById('btn-false').classList.remove('correct', 'wrong');
      document.getElementById('btn-true').disabled = false;
      document.getElementById('btn-false').disabled = false;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
    }

    function selectAnswer(userAnswer) {
      clearInterval(timerInterval);
      const q = currentQuestions[currentIndex];
      const isCorrect = (userAnswer === q.a);

      const btnTrue = document.getElementById('btn-true');
      const btnFalse = document.getElementById('btn-false');

      btnTrue.disabled = true;
      btnFalse.disabled = true;

      if (q.a === true) {
        btnTrue.classList.add('correct');
        if (!userAnswer) btnFalse.classList.add('wrong');
      } else {
        btnFalse.classList.add('correct');
        if (userAnswer) btnTrue.classList.add('wrong');
      }

      if (isCorrect) score++;

      document.getElementById('explanation-text').innerText = q.exp;
      document.getElementById('explanation-box').style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';
    }

    function timeOut() {
      const q = currentQuestions[currentIndex];
      document.getElementById('btn-true').disabled = true;
      document.getElementById('btn-false').disabled = true;

      if (q.a === true) {
        document.getElementById('btn-true').classList.add('correct');
      } else {
        document.getElementById('btn-false').classList.add('correct');
      }

      document.getElementById('explanation-text').innerText = "Time's up! " + q.exp;
      document.getElementById('explanation-box').style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-results').classList.remove('hidden');

      document.getElementById('final-score').innerText = score;
      document.getElementById('final-total').innerText = `out of ${currentQuestions.length}`;

      const pct = (score / currentQuestions.length) * 100;
      let msg = "Nice try!";
      if (pct >= 80) msg = "MythBuster Master Mind! 🧠🔥";
      else if (pct >= 50) msg = "Solid Science Knowledge! 🧪";
      document.getElementById('results-message').innerText = msg;
    }

    function resetToStart() {
      document.getElementById('screen-results').classList.add('hidden');
      document.getElementById('screen-start').classList.remove('hidden');
    }
  </script>
</body>
</html>
